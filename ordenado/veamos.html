<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuatro Contenedores</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        .wrapper {
            width: 90vmin;
            max-width: 800px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }
        .container {
            width: 100%;
            min-height: 280px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            text-align: center;
            padding: 2rem;
            font-size: 1.3rem;
        }
        .container1 {
            background: linear-gradient(270deg, rgba(255, 192, 203, 0.8) 0%, rgba(255, 255, 255, 0.8) 50%, rgba(52, 152, 219, 0.8) 100%);
        }
   
    </style>
</head>
<body>
        <div class="wrapper">
        <div class="container container1">Contenedor 1</div>
    </div>
</body>
</html>
